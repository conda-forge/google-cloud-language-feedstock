schema_version: 1

context:
  name: google-cloud-language
  version: "2.22.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_language-${{ version }}.tar.gz
  sha256: 839211650cfae7e7087c53a703b81f753ab70bad47c91e3b8c96ca300c1aee45

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # tightest of upstream's floors (python >=3.14)
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google.cloud.language
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Google Cloud Language API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-language
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-language
  documentation: https://cloud.google.com/python/docs/reference/language/latest

extra:
  recipe-maintainers:
    - xylar
    - BrentDorsey
    - parthea
